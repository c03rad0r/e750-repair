---
# BSBF server settings. Pinned to immutable upstream identifiers so a run is
# reproducible; no BSBF source is vendored (AGPL-3.0, no-vendor policy).

# bsbf-resources main at the time this role was written.
bsbf_server_commit: "75a54685b94515a388bd8278a9586f1086f1dcee"
bsbf_server_installer_sha256: "bc774d329d668f4de6dcf1ed1cbc13345003818f0fd1218f60935feff7981dae"

# Xray install script and release are pinned independently of the BSBF script.
bsbf_server_xray_install_commit: "e42df6a772e60dd7b058f852262c4dbeb0bc231d"
bsbf_server_xray_version: "v26.10.21"

# First client slot is 16384; the limit must cover the range we open.
bsbf_server_client_limit: 16
bsbf_server_client_rate_mbps: 50
bsbf_server_port_range: "16384:16400"

bsbf_server_src_dir: "/usr/local/src/bsbf"
bsbf_server_credentials_dir: "{{ playbook_dir }}/state/bsbf"
bsbf_server_manage_ufw: true
