---
# SSH transport — use this once the device is reachable on the LAN.
#
#   ansible-playbook -i inventory/ssh.yml playbook.yml
#
# Requires the router's LAN port to have carrier (check: `ip -4 addr show br-lan`
# must NOT say NO-CARRIER) and a root credential. On a stock image root has no
# password and sshd refuses password logins until you set one:
#
#   # over the serial console:
#   passwd
#   # then, from the host:
#   ssh-copy-id root@192.168.1.1

e750:
  hosts:
    e750-lan:
      ansible_connection: ssh
      ansible_host: "{{ lan_ip }}"
      ansible_user: root
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=~/.ssh/known_hosts_e750
        -o ConnectTimeout=10
        -o ServerAliveInterval=5
        -o ServerAliveCountMax=3
      ansible_shell_type: ash
