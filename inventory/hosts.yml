---
# Two transports are supported. Pick with -i.
#
#   inventory/hosts.yml         serial console (works when the device has NO network)
#   inventory/ssh.example.yml   SSH over the LAN (works once br-lan has carrier)
#
# The serial transport uses the custom `serial_console` connection plugin in
# connection_plugins/. Each command is base64-encoded and SHA-256 verified on the
# device before it runs, with retries on corruption.

e750:
  hosts:
    e750-console:
      ansible_connection: serial_console
      ansible_serial_port: "{{ device_serial_port }}"
      ansible_serial_baud: "{{ device_serial_baud }}"
      ansible_serial_timeout: 15
      ansible_serial_retries: 20
      # Wrap each command in base64 + SHA-256 so corruption can only retry.
      ansible_serial_verify_checksum: true
      # no python on a stock OpenWrt image - never try to run modules as scripts
      ansible_python_interpreter: "/usr/bin/env python3"
      ansible_shell_type: sh
      ansible_host: "serial"
